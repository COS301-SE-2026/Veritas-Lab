name: Main CD
#Only runs when codes gets on main so either a merged PR or a direct push.
on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    deploy-azure:
        environment: Prod
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                lfs: false

            - name: Restore model cache
              id: model-cache
              uses: actions/cache@v4
              with:
                path: |
                  Backend/app/ai/best_video_model.pt
                  Backend/app/ai/audio/model.safetensors
                  Backend/app/ai/lexical_detector/model.safetensors
                key: ai-models-v1

            - name: Download models from R2
              if: ${{ steps.model-cache.outputs.cache-hit != 'true' }}
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: auto
                R2_URL: ${{ secrets.R2_URL }}
                VIDEO_MODEL_S3_URL: ${{ secrets.VIDEO_MODEL_S3_URL }}
                AUDIO_MODEL_S3_URL: ${{ secrets.AUDIO_MODEL_S3_URL }}
                LEXICAL_MODEL_S3_URL: ${{ secrets.LEXICAL_MODEL_S3_URL }}
              run: |
                mkdir -p Backend/app/ai/audio
                mkdir -p Backend/app/ai/lexical_detector

                aws s3 cp "${VIDEO_MODEL_S3_URL}" Backend/app/ai/best_video_model.pt --endpoint-url "${R2_URL}"
                aws s3 cp "${AUDIO_MODEL_S3_URL}" Backend/app/ai/audio/model.safetensors --endpoint-url "${R2_URL}"
                aws s3 cp "${LEXICAL_MODEL_S3_URL}" Backend/app/ai/lexical_detector/model.safetensors --endpoint-url "${R2_URL}"

            - name: Verify models
              run: |
                test -s Backend/app/ai/best_video_model.pt
                test -s Backend/app/ai/audio/model.safetensors
                test -s Backend/app/ai/lexical_detector/model.safetensors

            - uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                context: ./Backend
                push: true
                tags: ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}
            - uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ghcr.io/cos301-se-2026/veritas-lab-frontend:${{ github.sha }}
            - uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_56CD338B385F4779A7BC4676B29FB956 }}
                tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BED7D1D0A9DC411E9AE99306D126609E }}
                subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02B6A6C1098B4F408E9DEBBC5971A95D }}
            - uses: azure/webapps-deploy@v3
              with:
                app-name: veritas-lab-api
                sitecontainers-config: >-
                    [
                        {
                            "name": "main",
                            "image": "ghcr.io/cos301-se-2026/veritas-lab-frontend:${{ github.sha }}",
                            "targetPort": 3000,
                            "isMain": true,
                            "authType": "UserCredentials",
                            "userName": "${{ secrets.GHCR_USERNAME }}",
                            "passwordSecret": "${{ secrets.GHCR_PAT}}"
                        },
                        {
                            "name": "backend",
                            "image": "ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}",
                            "targetPort": 8000,
                            "isMain": false,
                            "authType": "UserCredentials",
                            "userName": "${{ secrets.GHCR_USERNAME }}",
                            "passwordSecret": "${{ secrets.GHCR_PAT}}"
                        }
                    ]
    rollback:
        name: rollback
        needs: [deploy-azure]
        if: failure()
        environment: Prod
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 2

            - id: previous
              run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            - uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_56CD338B385F4779A7BC4676B29FB956 }}
                tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BED7D1D0A9DC411E9AE99306D126609E }}
                subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02B6A6C1098B4F408E9DEBBC5971A95D }}

            - uses: azure/webapps-deploy@v3
              with:
                app-name: veritas-lab-api
                sitecontainers-config: >-
                    [
                        {
                            "name": "main",
                            "image": "ghcr.io/cos301-se-2026/veritas-lab-frontend:${{ steps.previous.outputs.sha }}",
                            "targetPort": 3000,
                            "isMain": true,
                            "authType": "UserCredentials",
                            "userName": "${{ secrets.GHCR_USERNAME }}",
                            "passwordSecret": "${{ secrets.GHCR_PAT }}"
                        },
                        {
                            "name": "backend",
                            "image": "ghcr.io/cos301-se-2026/veritas-lab-backend:${{ steps.previous.outputs.sha }}",
                            "targetPort": 8000,
                            "isMain": false,
                            "authType": "UserCredentials",
                            "userName": "${{ secrets.GHCR_USERNAME }}",
                            "passwordSecret": "${{ secrets.GHCR_PAT }}"
                        }
                    ]
