name: CD Preview
#deploys a preview of the current branch to vercel.
on:
    workflow_call:
    workflow_dispatch:

jobs:
    deploy-preview:
        # Vercel frontend preview runs whenever CI passes
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: Dev - veritas-lab
            url: ${{ steps.deploy.outputs.url }}
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
            - name: install Vercel CLI
              run: npm install -g vercel
            - name: deploy to vercel (preview)
              id: deploy
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  url="$(vercel deploy --token="$VERCEL_TOKEN")"
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "preview deployed to $url"
    deploy-backend:
        # Render backend: only on merge/push to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: render-backend-dev
            cancel-in-progress: false
        steps:
            - name: trigger Render deploy
              id: trigger
              env:
                  HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
              run: |
                  response="$(curl -fsS -X POST "$HOOK")"
                  echo "Render response: $response"
                  deploy_id="$(echo "$response" | jq -r '.deploy.id // empty')"
                  if [ -z "$deploy_id" ]; then
                    echo "could not read deploy id from hook response"
                    exit 1
                  fi
                  echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

            - name: wait for build to finish
              env:
                  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
                  SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
                  DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
              run: |
                  for i in $(seq 1 60); do
                    status="$(curl -fsS \
                      -H "Authorization: Bearer $RENDER_API_KEY" \
                      -H "Accept: application/json" \
                      "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
                      | jq -r '.status')"
                    echo "attempt $i/60: $status"
                    case "$status" in
                      live)
                        echo "::notice::Render deploy succeeded"
                        exit 0 ;;
                      build_failed|update_failed|pre_deploy_failed|canceled)
                        echo "::error::Render deploy failed with status: $status"
                        exit 1 ;;
                    esac
                    sleep 15
                  done
                  echo "::error::timed out after 15 minutes waiting for Render"
                  exit 1
