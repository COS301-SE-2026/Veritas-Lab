name: Dev CI
#we want the CI to only run when we create a pull request to dev or when that PR is updated
#obviously if the CI fails you dont merge.
on:
    pull_request:
        branches-ignore:
            - main
            - database/changes/how-evidence-is-put-on-a-case
    workflow_dispatch:
jobs:

    download-models:
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
        - uses: actions/checkout@v4
          with:
            lfs: false

        - name: Restore model cache
          id: model-cache
          uses: actions/cache@v4
          with:
            path: |
              Backend/app/ai/best_video_model.pt
              Backend/app/ai/audio/model.safetensors
              Backend/app/ai/lexical_detector/model.safetensors
            key: ai-models-v1

        - name: Download models from R2
          if: ${{ steps.model-cache.outputs.cache-hit != 'true' }}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: auto
            R2_URL: ${{ secrets.R2_URL }}
            VIDEO_MODEL_S3_URL: ${{ secrets.VIDEO_MODEL_S3_URL }}
            AUDIO_MODEL_S3_URL: ${{ secrets.AUDIO_MODEL_S3_URL }}
            LEXICAL_MODEL_S3_URL: ${{ secrets.LEXICAL_MODEL_S3_URL }}
          run: |
            mkdir -p Backend/app/ai/audio
            mkdir -p Backend/app/ai/lexical_detector

            echo "Downloading video model..."
            aws s3 cp "${VIDEO_MODEL_S3_URL}" Backend/app/ai/best_video_model.pt --endpoint-url "${R2_URL}"

            echo "Downloading audio model..."
            aws s3 cp "${AUDIO_MODEL_S3_URL}" Backend/app/ai/audio/model.safetensors --endpoint-url "${R2_URL}"

            echo "Downloading lexical model..."
            aws s3 cp "${LEXICAL_MODEL_S3_URL}" Backend/app/ai/lexical_detector/model.safetensors --endpoint-url "${R2_URL}"

        - name: Verify models
          run: |
            test -s Backend/app/ai/best_video_model.pt
            test -s Backend/app/ai/audio/model.safetensors
            test -s Backend/app/ai/lexical_detector/model.safetensors
            ls -lh Backend/app/ai/best_video_model.pt
            ls -lh Backend/app/ai/audio/model.safetensors
            ls -lh Backend/app/ai/lexical_detector/model.safetensors

    docker-build:
        needs: download-models
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4
              with:
                lfs: false

            - name: Restore model cache
              uses: actions/cache@v4
              with:
                lfs: false
                path: |
                  Backend/app/ai/best_video_model.pt
                  Backend/app/ai/audio/model.safetensors
                  Backend/app/ai/lexical_detector/model.safetensors
                key: ai-models-v1

            - name: build Docker images
              env:
                  ENVIRONMENT: development
                  FRONTEND_ORIGIN: http://localhost:3000
                  STORAGE_URL: http://localhost:9000
                  MINIO_EXTERNAL_URL: http://localhost:9000
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
                  E2E_INVESTIGATOR_EMAIL: ${{ secrets.E2E_INVESTIGATOR_EMAIL }}
                  E2E_INVESTIGATOR_PASSWORD: ${{ secrets.E2E_INVESTIGATOR_PASSWORD }}
                  E2E_INVESTIGATOR_NAME: ${{ secrets.E2E_INVESTIGATOR_NAME }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
                  ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
                  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
                  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
                  E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  R2_URL: ${{ secrets.R2_URL }}
                  R2_TOKEN_VALUE: ${{ secrets.R2_TOKEN_VALUE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
                  AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
                  AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
              run: |
                  docker compose up -d --build

            - name: cleaner
              env:
                  ENVIRONMENT: development
                  FRONTEND_ORIGIN: http://localhost:3000
                  STORAGE_URL: http://localhost:9000
                  MINIO_EXTERNAL_URL: http://localhost:9000
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
                  E2E_INVESTIGATOR_EMAIL: ${{ secrets.E2E_INVESTIGATOR_EMAIL }}
                  E2E_INVESTIGATOR_PASSWORD: ${{ secrets.E2E_INVESTIGATOR_PASSWORD }}
                  E2E_INVESTIGATOR_NAME: ${{ secrets.E2E_INVESTIGATOR_NAME }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
                  ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
                  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
                  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
                  E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  R2_URL: ${{ secrets.R2_URL }}
                  R2_TOKEN_VALUE: ${{ secrets.R2_TOKEN_VALUE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
                  AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
                  AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
              if: always()
              run: |
                  docker compose down -v --rmi all --remove-orphans

    backend-unit-tests:
        needs: download-models
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                lfs: false

            - name: Restore model cache
              uses: actions/cache@v4
              with:
                path: |
                  Backend/app/ai/best_video_model.pt
                  Backend/app/ai/audio/model.safetensors
                  Backend/app/ai/lexical_detector/model.safetensors
                key: ai-models-v1

            - name: set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: install dependencies
              run: |
                  cd Backend
                  python -m pip install --upgrade pip
                  python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
                  python -m pip install -r requirements/base.txt

            - name: run PyTest unit tests
              env:
                  ENVIRONMENT: development
                  FRONTEND_ORIGIN: http://localhost:3000
                  STORAGE_URL: http://localhost:9000
                  MINIO_EXTERNAL_URL: http://localhost:9000
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
                  E2E_INVESTIGATOR_EMAIL: ${{ secrets.E2E_INVESTIGATOR_EMAIL }}
                  E2E_INVESTIGATOR_PASSWORD: ${{ secrets.E2E_INVESTIGATOR_PASSWORD }}
                  E2E_INVESTIGATOR_NAME: ${{ secrets.E2E_INVESTIGATOR_NAME }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
                  ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
                  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
                  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
                  E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  R2_URL: ${{ secrets.R2_URL }}
                  R2_TOKEN_VALUE: ${{ secrets.R2_TOKEN_VALUE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
                  AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
                  AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
              run: |
                  cd Backend
                  python -m pytest app/tests/unit --asyncio-mode=auto --cov=app

    frontend-unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: run Jest
              run: |
                  cd frontend
                  npx jest "__tests__/components" "__tests__/hooks"

    backend-integration-tests:
        needs:
            - docker-build
            - backend-unit-tests
            - frontend-unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: false

            - name: Restore model cache
              uses: actions/cache@v4
              with:
                path: |
                  Backend/app/ai/best_video_model.pt
                  Backend/app/ai/audio/model.safetensors
                  Backend/app/ai/lexical_detector/model.safetensors
                key: ai-models-v1

            - name: set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: start Docker services
              env:
                  ENVIRONMENT: development
                  FRONTEND_ORIGIN: http://localhost:3000
                  STORAGE_URL: http://localhost:9000
                  MINIO_EXTERNAL_URL: http://localhost:9000
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
                  E2E_INVESTIGATOR_EMAIL: ${{ secrets.E2E_INVESTIGATOR_EMAIL }}
                  E2E_INVESTIGATOR_PASSWORD: ${{ secrets.E2E_INVESTIGATOR_PASSWORD }}
                  E2E_INVESTIGATOR_NAME: ${{ secrets.E2E_INVESTIGATOR_NAME }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
                  ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
                  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
                  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
                  E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  R2_URL: ${{ secrets.R2_URL }}
                  R2_TOKEN_VALUE: ${{ secrets.R2_TOKEN_VALUE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
                  AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
                  AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
              run: |
                  docker compose up -d --build

            - name: install dependencies
              run: |
                  cd Backend
                  python -m pip install --upgrade pip
                  python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
                  python -m pip install -r requirements/base.txt
                  sudo apt-get update
                  sudo apt-get install -y libimage-exiftool-perl ffmpeg

            - name: run PyTest integration tests
              env:
                  ENVIRONMENT: development
                  FRONTEND_ORIGIN: http://localhost:3000
                  STORAGE_URL: http://localhost:9000
                  MINIO_EXTERNAL_URL: http://localhost:9000
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
                  E2E_INVESTIGATOR_EMAIL: ${{ secrets.E2E_INVESTIGATOR_EMAIL }}
                  E2E_INVESTIGATOR_PASSWORD: ${{ secrets.E2E_INVESTIGATOR_PASSWORD }}
                  E2E_INVESTIGATOR_NAME: ${{ secrets.E2E_INVESTIGATOR_NAME }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
                  ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
                  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
                  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
                  E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  R2_URL: ${{ secrets.R2_URL }}
                  R2_TOKEN_VALUE: ${{ secrets.R2_TOKEN_VALUE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
                  AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
                  AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
              run: |
                  cd Backend
                  python -m pytest app/tests/integration --asyncio-mode=auto --cov=app

            - name: cleaner
              env:
                  ENVIRONMENT: development
                  FRONTEND_ORIGIN: http://localhost:3000
                  STORAGE_URL: http://localhost:9000
                  MINIO_EXTERNAL_URL: http://localhost:9000
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
                  E2E_INVESTIGATOR_EMAIL: ${{ secrets.E2E_INVESTIGATOR_EMAIL }}
                  E2E_INVESTIGATOR_PASSWORD: ${{ secrets.E2E_INVESTIGATOR_PASSWORD }}
                  E2E_INVESTIGATOR_NAME: ${{ secrets.E2E_INVESTIGATOR_NAME }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
                  ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
                  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
                  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
                  E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  R2_URL: ${{ secrets.R2_URL }}
                  R2_TOKEN_VALUE: ${{ secrets.R2_TOKEN_VALUE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
                  AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
                  AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
              if: always()
              run: |
                  docker compose down -v --rmi all --remove-orphans

    frontend-integration-tests:
        needs:
            - docker-build
            - backend-unit-tests
            - frontend-unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: run Jest
              run: |
                  cd frontend
                  npx jest "__tests__/integration"
