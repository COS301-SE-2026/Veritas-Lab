name: Deploy Azure (test)

on:
    workflow_dispatch:
    #pull_request:
    #    branches: ["feature/backend/cd-testing"]
        
permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/veritas-lab-backend:latest
                      ghcr.io/${{ github.repository_owner }}/veritas-lab-backend:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                  app-name: veritas-lab-api
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ghcr.io/${{ github.repository_owner }}/veritas-lab-backend:latest
