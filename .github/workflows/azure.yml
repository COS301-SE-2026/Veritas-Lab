name: Deploy Azure (test)

on:
    workflow_dispatch:
    #pull_request:
    #    branches: ["feature/backend/cd-testing"]
        
permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: lowercased image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/veritas-lab-backend" >> "$GITHUB_OUTPUT"
            
            - name: log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:latest
                      ${{ steps.image.outputs.name }}:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                  app-name: veritas-lab-api
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ghcr.io/cos301-se-2026/veritas-lab-backend:latest
