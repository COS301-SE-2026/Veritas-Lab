name: CD
#Only runs when codes gets on main so either a merged PR or a direct push.
on:
    workflow_dispatch:
    
permissions:
    contents: read
    packages: write
    
jobs:
    backend-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: install dependencies
              run: |
                  cd Backend
                  python -m pip install --upgrade pip
                  python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
                  python -m pip install -r requirements/base.txt
                  
            - name: debug env
              run: |
                  echo "DB_HOST=$DB_HOST"
              env:
                  DB_HOST: localhost

            - name: run PyTest
              env:
                  DB_HOST: localhost
                  DB_USER: postgres
                  DB_PASSWORD: postgres
                  DB_NAME: test_db
                  DB_PORT: 5432
                  DB_SSL: false
                  JWT_SECRET: test-secret
                  HASH: HS256
                  TOKEN_EXPIRE: 5
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                  MINIO_API_PORT: 9000
                  MINIO_CONSOLE_PORT: 9001
                  AWS_REGION: af-south-1
              run: |
                  cd Backend
                  python -m pytest app/tests/ --asyncio-mode=auto --cov=app

    frontend-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: run Jest
              run: |
                  cd frontend
                  npx jest
    deploy-azure:
        needs: [backend-tests, frontend-tests]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  push: true
                  tags: |
                      ghcr.io/cos301-se-2026/veritas-lab-backend:latest
                      ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}

            - name: deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@v3
              with:
                  app-name: veritas-lab-api
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}
