name: CD
#Only runs when codes gets on main so either a merged PR or a direct push.
on:
    workflow_call: 

permissions:
    contents: read
    packages: write

jobs:
    deploy-azure:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  push: true
                  tags: |
                      ghcr.io/cos301-se-2026/veritas-lab-backend:latest
                      ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}

            - name: deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@v3
              with:
                  app-name: veritas-lab-api
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}
    deploy-vercel:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: Production - veritas-lab
            url: ${{ steps.deploy.outputs.url }}
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        steps:
            #push to main checks out the branch properly (not detached),
            #so the vercel cli picks up "main" as the branch on its own here.
            - uses: actions/checkout@v4
 
            - name: install Vercel CLI
              run: npm install -g vercel
 
            - name: deploy to vercel (production)
              id: deploy
              run: |
                  url="$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})"
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "production frontend deployed to $url"
