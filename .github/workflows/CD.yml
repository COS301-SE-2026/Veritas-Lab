name: CD
#Only runs when codes gets on main so either a merged PR or a direct push.
on:
    workflow_call: 

permissions:
    contents: read
    packages: write

jobs:
    deploy-azure:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: Production - veritas-lab
            url: ${{ steps.deploy.outputs.webapp-url }}
        steps:
            - uses: actions/checkout@v4

            - name: log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  push: true
                  tags: |
                      ghcr.io/cos301-se-2026/veritas-lab-backend:latest
                      ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}

            - name: deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@v3
              with:
                  app-name: veritas-lab-api
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ghcr.io/cos301-se-2026/veritas-lab-backend:${{ github.sha }}
